<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Optimizer & Music Player</title>
  <meta name="description" content="最適化ルートで自動走行するミニマルな蛇ゲームとモノトーン音楽プレイヤー">

  <!-- Minimal Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Snake Game Container (Left) -->
    <main class="snake-card">
      <div class="top-bar">
        <div class="score-display">
          <span class="score-label">SCORE</span>
          <span id="scoreValue" class="score-num">0</span>
        </div>
        <div id="statusText" class="status-indicator">待機中</div>
      </div>

      <div class="board-frame">
        <canvas id="gameCanvas" width="588" height="588"></canvas>
      </div>

      <div class="controls">
        <button id="startBtn" class="primary-btn">
          <span class="btn-icon" id="btnIcon">▶</span>
          <span id="btnText">スタート</span>
        </button>
        <button id="resetBtn" class="text-btn">リセット</button>
      </div>
    </main>

    <!-- Monotone Music Player Container (Right) -->
    <aside class="player-card">
      <!-- 1. 上に再生すると回るレコード (サムネイル表示) -->
      <div class="record-wrapper">
        <div id="recordDisc" class="record-disc paused">
          <div class="record-grooves"></div>
          <div class="record-center">
            <img id="recordThumb" class="record-thumbnail" src="" alt="Track Thumbnail">
            <div class="record-spindle"></div>
          </div>
        </div>
      </div>

      <!-- 2. 再生ボタンとレコードマークの間にタイトルを表示 -->
      <div class="track-info">
        <div class="track-badge" id="trackIndex">TRACK 01 / 03</div>
        <h2 class="track-title" id="trackTitle">Midnight Coast Chill</h2>
        <p class="track-artist" id="trackArtist">Sound Eve</p>
      </div>

      <!-- 3. コントロールボタン (前へ、再生/停止、次へ) + 右側に音量調節 -->
      <div class="player-controls">
        <div class="playback-buttons">
          <button id="prevBtn" class="player-btn icon-btn" title="前の曲へ" aria-label="前の曲へ">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>
          
          <button id="playBtn" class="player-btn play-main-btn" title="再生 / 一時停止" aria-label="再生 / 一時停止">
            <svg id="playIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>

          <button id="nextBtn" class="player-btn icon-btn" title="次の曲へ" aria-label="次の曲へ">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
        </div>

        <!-- スキップボタンの右側に音量調節ボタン -->
        <div class="volume-container">
          <button id="muteBtn" class="volume-btn" title="ミュート切替" aria-label="ミュート切替">
            <svg id="volumeIcon" viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="muteIcon" class="hidden" viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70" aria-label="音量調整">
        </div>
      </div>
    </aside>
  </div>

  <script src="game.js"></script>
  <script src="player.js"></script>
</body>
</html>
